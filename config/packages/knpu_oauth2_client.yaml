knpu_oauth2_client:
    clients:
        google:
            type: google
            # add and configure client_id and client_secret in your .env files
            client_id: '%env(OAUTH_GOOGLE_ID)%'
            client_secret: '%env(OAUTH_GOOGLE_SECRET)%'
            # a route name you'll create
            redirect_route: connect_google_check
            redirect_params: {}
